name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bbosi-app/package-lock.json

      - name: Install dependencies
        working-directory: bbosi-app
        run: npm ci

      - name: Test
        working-directory: bbosi-app
        run: npm run test -- --watch=false

      - name: Build
        working-directory: bbosi-app
        run: npx ng build --base-href /bbosi/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bbosi-app/dist/bbosi-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
